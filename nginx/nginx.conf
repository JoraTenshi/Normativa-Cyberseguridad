events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep request paths for diagnostics without query strings or Referer values.
    log_format safe_access '$remote_addr [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe_access;

    server_tokens   off;
    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    upstream backend  { server backend:5000; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header Referrer-Policy           "no-referrer"                         always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # CSP del frontend (React compilado): solo recursos propios, Google Fonts y data: para el QR del 2FA.
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        # Ningún location define add_header: si uno lo hiciera, dejaría de heredar TODAS las cabeceras de arriba.

        # security.txt (RFC 9116) — served as plain text, no auth, no redirect.
        location = /.well-known/security.txt {
            alias   /var/www/well-known/security.txt;
            charset utf-8;
        }

        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            # El backend (Helmet) envía los mismos valores; se quitan para que cada cabecera salga una vez.
            proxy_hide_header  Strict-Transport-Security;
            proxy_hide_header  X-Frame-Options;
            proxy_hide_header  X-Content-Type-Options;
            proxy_hide_header  Referrer-Policy;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
