services:
  mongodb:
    image: mongo:7
    container_name: cybersec_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cybersec_audit

  nginx:
    image: nginx:alpine
    container_name: cybersec_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # Allows the container to reach Node.js processes running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

volumes:
  mongo_data:
