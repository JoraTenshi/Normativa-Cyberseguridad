services:
  mongodb:
    image: mongo:7
    container_name: cybersec_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cybersec}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: cybersec_audit
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" \"mongodb://${MONGO_USER:-cybersec}:${MONGO_PASSWORD}@127.0.0.1:27017/admin?authSource=admin\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    container_name: cybersec_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-cybersec}:${MONGO_PASSWORD}@mongodb:27017/cybersec_audit?authSource=admin
    volumes:
      - ./backend/.env:/app/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: cybersec_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - cybersec-net

  nginx:
    image: nginx:alpine
    container_name: cybersec_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cybersec-net

networks:
  cybersec-net:
    driver: bridge

volumes:
  mongo_data:
  frontend_modules:
