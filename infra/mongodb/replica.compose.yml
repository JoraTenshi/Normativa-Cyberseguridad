# Un nodo para práctica/desarrollo: transacciones, NO alta disponibilidad.
services:
  mongodb:
    command: ["mongod", "--replSet", "nc-rs", "--keyFile", "/run/nc-mongodb-keyfile", "--bind_ip_all"]
    volumes:
      - ./.runtime/mongodb/keyfile:/run/nc-mongodb-keyfile:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "const a=db.getSiblingDB('admin'); if(!a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD))quit(2); const h=a.runCommand({hello:1}); quit(h.setName==='nc-rs'&&h.isWritablePrimary?0:2)"
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
  backend:
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-cybersec}:${MONGO_PASSWORD}@mongodb:27017/cybersec_audit?authSource=admin&replicaSet=nc-rs&w=majority&retryWrites=true
  scraper:
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-cybersec}:${MONGO_PASSWORD}@mongodb:27017/cybersec_audit?authSource=admin&replicaSet=nc-rs&w=majority&retryWrites=true
